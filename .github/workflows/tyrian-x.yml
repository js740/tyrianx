name: Tyrian X

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Tyrian X build and determinism checks
    runs-on: ubuntu-latest
    container: gcc:16-trixie   # C++26 reflection needs GCC 16
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            pkg-config curl unzip python3 libsdl2-dev libsdl2-net-dev
      - name: Stock C build
        run: make -j"$(nproc)" debug
      - name: WITH_TYRX build (includes state registry check)
        run: make -j"$(nproc)" debug WITH_TYRX=true
      - name: Cache game data
        uses: actions/cache@v6
        with:
          path: data
          key: tyrian21-data-v1
      - name: Get game data
        run: ./get_data.sh data
      - name: Demo playback is deterministic
        run: |
          tools/run_headless.sh ./opentyrian data demos1.log demos
          tools/run_headless.sh ./opentyrian data demos2.log demos
          tools/compare_hashlogs.py demos1.log demos2.log
      - name: Synthetic-input play is deterministic
        run: |
          tools/run_headless.sh ./opentyrian data input1.log input 1 10000
          tools/run_headless.sh ./opentyrian data input2.log input 1 10000
          tools/compare_hashlogs.py input1.log input2.log
      - name: Input is read only once per tick
        run: |
          tools/run_headless.sh ./opentyrian data cmd1.log input 1 10000 TYRX_INPUT_COMMANDS=1
          tools/run_headless.sh ./opentyrian data cmd2.log input 1 10000 TYRX_INPUT_COMMANDS=1 TYRX_INPUT_MIDTICK=1
          tools/compare_hashlogs.py cmd1.log cmd2.log
      - name: Draw lists record and reproduce every pixel drawn
        run: |
          tools/run_headless.sh ./opentyrian data drawlist.log demos TYRX_DRAWLIST_CHECK=1
          tools/run_headless.sh ./opentyrian data drawlist-cheats.log input 1 10000 TYRX_INPUT_CHEATS=1 TYRX_DRAWLIST_CHECK=1
      - name: The C++ level loop matches the C code
        run: |
          tools/run_headless.sh ./opentyrian data shadow.log demos TYRX_SHADOW=1
          tools/run_headless.sh ./opentyrian data shadow-cheats.log input 1 10000 TYRX_INPUT_CHEATS=1 TYRX_SHADOW=1
          tools/run_headless.sh ./opentyrian data shadow-2p.log input 1 10000 TYRX_INPUT_TWO_PLAYER=1 TYRX_INPUT_MOUSE=1 TYRX_INPUT_CHEATS=1 TYRX_SHADOW=1
          tools/run_headless.sh ./opentyrian data shadow-screens.log input 2 10000 TYRX_INPUT_SCREENS=1 TYRX_INPUT_CHEATS=1 TYRX_SHADOW=1
      - name: The C++ tick plays as the C tick does
        run: |
          tools/run_headless.sh ./opentyrian data c-demos.log demos TYRX_FRAMELOG="$PWD/c-demos.frames"
          tools/run_headless.sh ./opentyrian data x-demos.log demos TYRX_FRAMELOG="$PWD/x-demos.frames" TYRX_CXX_TICK=1
          tools/compare_hashlogs.py c-demos.log x-demos.log
          cmp c-demos.frames x-demos.frames
          tools/run_headless.sh ./opentyrian data c-screens.log input 1 10000 TYRX_INPUT_SCREENS=1 TYRX_INPUT_CHEATS=1 TYRX_FRAMELOG="$PWD/c-screens.frames"
          tools/run_headless.sh ./opentyrian data x-screens.log input 1 10000 TYRX_INPUT_SCREENS=1 TYRX_INPUT_CHEATS=1 TYRX_FRAMELOG="$PWD/x-screens.frames" TYRX_CXX_TICK=1
          tools/compare_hashlogs.py c-screens.log x-screens.log
          cmp c-screens.frames x-screens.frames
      - name: C++ ports match the C code
        run: |
          tools/run_headless.sh ./opentyrian data diff-demos.log demos TYRX_DIFF=1 TYRX_RENDER_DIFF=1
          tools/run_headless.sh ./opentyrian data diff-input.log input 2 10000 TYRX_DIFF=1 TYRX_RENDER_DIFF=1
      - name: Snapshots restore everything a tick depends on
        run: |
          tools/run_headless.sh ./opentyrian data rt.log input 1 10000 TYRX_ROUNDTRIP=7,13
          tools/compare_hashlogs.py input1.log rt.log
      - name: Joystick play is deterministic and survives round trips
        run: |
          tools/run_headless.sh ./opentyrian data joy1.log input 1 10000 TYRX_INPUT_JOYSTICK=1
          tools/run_headless.sh ./opentyrian data joy2.log input 1 10000 TYRX_INPUT_JOYSTICK=1
          tools/compare_hashlogs.py joy1.log joy2.log
          tools/run_headless.sh ./opentyrian data joy-rt.log input 1 10000 TYRX_INPUT_JOYSTICK=1 TYRX_ROUNDTRIP=1,1
          tools/compare_hashlogs.py joy1.log joy-rt.log
      - name: Rewind restores recorded states
        run: |
          tools/run_headless.sh ./opentyrian data rewind.log input 1 10000 TYRX_REWIND=350 TYRX_INPUT_REWIND=1 TYRX_REWIND_VERIFY=1
